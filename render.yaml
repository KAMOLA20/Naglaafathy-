services:
  - type: web
    name: naglaa-fathi-academy
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production node server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.18.0"
      - key: FAWRY_ENV
        value: sandbox
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: FAWRY_MERCHANT_CODE
        sync: false
      - key: FAWRY_SECURITY_KEY
        sync: false
